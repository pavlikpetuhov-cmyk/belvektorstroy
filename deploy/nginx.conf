# Nginx конфигурация для БелВекторСтрой
# Файл: /etc/nginx/sites-available/belvektorstroy

server {
    listen 80;
    server_name belvektorstroy.ru www.belvektorstroy.ru;
    
    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name belvektorstroy.ru www.belvektorstroy.ru;
    
    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/belvektorstroy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belvektorstroy.ru/privkey.pem;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    
    # Корневая директория с билдом фронтенда
    root /var/www/belvektorstroy/frontend;
    index index.html;
    
    # Gzip сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    
    # Статические файлы фронтенда
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Кэширование статики
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # API проксирование на бэкенд
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
